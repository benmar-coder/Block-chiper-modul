name: Cipher Module CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    #1. virtuális szerver
    - name: Kód letöltése (Checkout)
      uses: actions/checkout@v3

    # 2. Feltelepíti a Pythont
    - name: Python 3.10 beállítása
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Feltelepíti a csomagjaidat (pl. jsonschema, cryptography, pytest)
    - name: Függőségek telepítése
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Biztosítjuk, hogy a pytest fent van
        pip install pytest 

    # 4. Lefuttatja az 1MB-os integrációs teszteket
    - name: Pytest tesztek futtatása
      run: |
        python -m pytest tests/ -v